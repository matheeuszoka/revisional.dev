# Reverse proxy do Revisional. ${DOMINIO} vem do environment do container.
ServerName ${DOMINIO}

# HTTP: responde o challenge do Let's Encrypt e redireciona o resto p/ HTTPS
<VirtualHost *:80>
    ServerName ${DOMINIO}

    Alias /.well-known/acme-challenge/ /var/www/certbot/.well-known/acme-challenge/
    <Directory "/var/www/certbot">
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://${DOMINIO}:${PORTA_EXTERNA}$1 [R=301,L]
</VirtualHost>

# HTTPS: só entra em cena depois do primeiro certificado emitido
# (IfFile evita que o Apache quebre no bootstrap, antes do certbot rodar)
<IfFile "/etc/letsencrypt/live/${DOMINIO}/fullchain.pem">
Listen 443
<VirtualHost *:443>
    ServerName ${DOMINIO}

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/${DOMINIO}/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/${DOMINIO}/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # API Spring Boot
    ProxyPass        /api/ http://backend:8080/api/
    ProxyPassReverse /api/ http://backend:8080/api/

    # SPA React (nginx)
    ProxyPass        / http://frontend:80/
    ProxyPassReverse / http://frontend:80/

    # Uploads de contrato podem demorar (OCR síncrono na fase 1)
    ProxyTimeout 300
</VirtualHost>
</IfFile>
