spring.application.name=revisonalweb_back-end

# --- PostgreSQL (dev: docker compose, porta 5435) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/revisional_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:revisional}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:revisional_dev_2026}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- Flyway (migrações versionadas; schema é dono do Flyway, não do Hibernate) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Segurança / JWT ---
api.security.token.secret=${JWT_SECRET:revisional-dev-secret-troque-em-producao-2026}

# --- Criptografia de segredos persistidos (chave da IA na tabela de configuração) ---
# Em produção, defina CONFIG_ENC_SECRET. Se mudar, a chave da IA salva precisa ser reinserida.
config.encryption.secret=${CONFIG_ENC_SECRET:revisional-config-enc-troque-em-producao-2026}

# --- MinIO (S3) ---
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9010}
minio.access-key=${MINIO_ROOT_USER:admin}
minio.secret-key=${MINIO_ROOT_PASSWORD:revisional_dev_2026}
minio.bucket=${MINIO_BUCKET:revisional-docs}

# --- Upload (multipart) ---
# ========== CONFIGURAÇÃO Tamanho Arquivos ==========
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# --- OCR (Tesseract via Tess4J) ---
# Caminho do tessdata. Em Docker/Linux: /usr/share/tesseract-ocr/5/tessdata. Vazio => tenta TESSDATA_PREFIX.
ocr.tessdata-path=${TESSDATA_PREFIX:}
ocr.idioma=${OCR_LANG:por}
ocr.dpi=${OCR_DPI:300}
ocr.max-paginas=${OCR_MAX_PAGINAS:25}

# --- Extração por IA (OpenRouter; opcional). Sem api-key => usa só regex/OCR. ---
openrouter.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
openrouter.api-key=${OPENROUTER_API_KEY:}
openrouter.model=${OPENROUTER_MODEL:google/gemini-2.0-flash-001}
openrouter.timeout-segundos=${OPENROUTER_TIMEOUT:45}
openrouter.referer=${OPENROUTER_REFERER:https://revisional.mpgsistemas.com.br}
openrouter.titulo=${OPENROUTER_TITULO:Revisional MPG Sistemas}
openrouter.max-chars=${OPENROUTER_MAX_CHARS:14000}

