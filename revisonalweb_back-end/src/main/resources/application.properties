spring.application.name=revisonalweb_back-end

# --- PostgreSQL (dev: docker compose, porta 5435) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/revisional_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:revisional}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:revisional_dev_2026}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# --- MinIO (S3) ---
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9010}
minio.access-key=${MINIO_ROOT_USER:admin}
minio.secret-key=${MINIO_ROOT_PASSWORD:revisional_dev_2026}
minio.bucket=${MINIO_BUCKET:revisional-docs}
