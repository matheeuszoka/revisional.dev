server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota do React Router cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Estáticos com hash no nome: cache longo
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
